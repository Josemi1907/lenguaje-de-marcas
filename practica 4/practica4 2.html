<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> th, td { border: 1px solid black; } </style>
</head>
<body>
    <table border="1">
        <thead>
            <tr><th>Categoría</th>
                <th>Etiquetas</th>
            </tr>
        </thead>

        <tbody>
            <!-- Parte de la tabla de formulario -->
            <tr>
                <td rowspan="5"> <b>Formulario</b></td>
                <td>form</td>
            </tr>
            <tr>
                <td>button</td>
            </tr>
            <tr>
                <td>input</td>
            </tr>
            <tr>
                <td>select</td>
            </tr>
            <tr>
                <td>textarea</td>
            </tr>

            <!-- Parte de la tabla de Tabla -->
            <tr>
                <td rowspan="5"> <b>Tabla</b></td>
                <td>table</td>
            </tr>
            <tr>
                <td>tr</td>
            </tr>
            <tr>
                <td>th</td>
            </tr>
            <tr>
                <td>td</td>
            </tr>
            <tr>
                <td>caption</td>
            </tr>

            <!-- Parte de la tabla de Texto -->
            <tr>
                <td rowspan="6"> <b>Texto</b></td>
                <td>b</td>
            </tr>
            <tr>
                <td>em</td>
            </tr>
            <tr>
                <td>i</td>
            </tr>
            <tr>
                <td>strong</td>
            </tr>
            <tr>
                <td>sub</td>
            </tr>
            <tr>
                <td>sup</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
