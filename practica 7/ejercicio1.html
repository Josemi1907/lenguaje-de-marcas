<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .verde {color:green;}
        .rojo {color: red}
        p > a:first-child {text-decoration: underline;}
        b > a:last-child {text-decoration: underline;}
        .azul {color: blue}
        .grande {font-size: 40px;}
    </style>
</head>
<body>
    <p>En el momento en que <a class="verde">entiendo verdaderamente</a> a mi <a class="rojo">enemigo</a>, 
       en el momento en que le <a style="text-decoration: overline underline;">entiendo</a> 
       lo suficientemente bien como para <b class="grande">derrotarle</b>, entonces, en ese preciso instante, 
       <b><a class="azul">tambien le </a><a class="rojo" >quiero</a></b></p>
</body>
</html>
