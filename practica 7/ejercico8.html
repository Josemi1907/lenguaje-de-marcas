<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contenedor { width: 100%; max-width: 1300px; margin: auto; font-size: 0; }

        .caja {height: 200px; display: inline-block; }

        .rojo {width: 33.33%; background-color: red; }

        .verde { width: 33.33%; background-color: green; }

        .azul { width: 33.33%; background-color: blue; }

        .negro { width: 100%; background-color: black; }

        .rosa { width: 50%; background-color: pink; }

        .naranja { width: 50%; background-color: orange; }
    </style>
</head>
<body>
    <div class="contenedor">
        <!-- Fila uno-->
        <div class="caja rojo"></div>
        <div class="caja verde"></div>
        <div class="caja azul"></div>

        <!-- Fila dos -->
        <div class="caja negro"></div>

        <!-- Fila tres-->
        <div class="caja rosa"></div>
        <div class="caja naranja"></div>

    </div>
</body>
</html>
